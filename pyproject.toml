[build-system]
# Pinned to a major range so a future Hatchling release cannot silently change
# how the package is built on a publish day.
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "repository-updater"
# Stays 0.0.0 in development; the release workflow stamps the real version
# from the Git tag with `uv version` at publish time.
version = "0.0.0"
description = "Home Assistant Community Apps Repository Updater"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.12"
authors = [{ name = "Franck Nijhof", email = "opensource@frenck.dev" }]
keywords = [
  "apps",
  "frenck",
  "home assistant",
  "home-assistant",
  "repository",
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
  "Typing :: Typed",
]
# Ranges, not pins: people install this with pip next to other things. The
# exact versions CI and the container use live in uv.lock.
dependencies = [
  "aiohttp>=3.14.5,<4",
  # Versioned by date, so a major bump is just a new year: no upper bound.
  "awesomeversion>=25.8.0",
  "click>=8.5.0,<9",
  "emoji>=2.16.0,<3",
  "GitPython>=3.2.1,<4",
  "Jinja2>=3.1.6,<4",
  "mashumaro>=3.23,<4",
  "orjson>=3.13.0,<4",
  "PyGithub>=2.10.0,<3",
  "PyYAML>=6.0.3,<7",
  "semver>=3.1.0,<4",
  "yarl>=1.25.1,<2",
]

[project.urls]
Homepage = "https://github.com/hassio-addons/repository-updater"
Source = "https://github.com/hassio-addons/repository-updater"
Issues = "https://github.com/hassio-addons/repository-updater/issues"

[project.scripts]
repository-updater = "repositoryupdater.cli:repository_updater"
repository-updater-git-askpass = "repositoryupdater.cli:git_askpass"

[dependency-groups]
# Pinned exactly for reproducible local and CI runs. CI installs this group
# with `uv sync`, so the versions live here and not in the workflows.
dev = [
  "actionlint-py==1.7.12.25",
  "aioresponses==0.7.9",
  "codespell==2.4.3",
  "covdefaults==2.3.0",
  "coverage[toml]==7.16.2",
  "pre-commit-hooks==6.0.0",
  "prek==0.5.7",
  "pylint==4.1.3",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.1",
  "shellcheck-py==0.11.0.1",
  "syrupy==6.1.1",
  "ty==0.0.90",
  "yamllint==1.38.0",
  "zizmor==1.31.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/repositoryupdater"]

# The sdist is explicit so its contents are auditable, rather than relying on
# Hatchling's default file selection.
[tool.hatch.build.targets.sdist]
include = [
  "src/repositoryupdater",
  "pyproject.toml",
  "README.md",
  "LICENSE.md",
]

[tool.pytest.ini_options]
addopts = "--cov --strict-markers --strict-config"
asyncio_mode = "auto"
xfail_strict = true

[tool.coverage.run]
plugins = ["covdefaults"]
# source_pkgs, not source: coverage cannot resolve a bare package name in a
# src layout and silently measures nothing.
source_pkgs = ["repositoryupdater"]

[tool.coverage.report]
show_missing = true
# covdefaults measures the tests too. The GitHub heavy load paths are hard to
# test on the current sync code; this goes up to 95 with the async rewrite.
fail_under = 85

[tool.codespell]
ignore-words-list = "hass"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# App and Repository start with their state set to None and fill it in
# load(), which ty cannot follow. That two-phase setup goes away with the
# async rewrite; this goes back to an error then, together with dropping
# --exit-zero-on-warning from the prek hook and the typing workflow.
unresolved-attribute = "warn"

[tool.pylint.MASTER]
ignore = ["tests"]

[tool.pylint.BASIC]
good-names = ["_", "ex", "fp", "i", "id", "j", "k", "on", "Run", "T"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
  "too-few-public-methods",
  "duplicate-code",
  "format",
  "unsubscriptable-object",
]

[tool.pylint.SIMILARITIES]
ignore-imports = true

[tool.pylint.FORMAT]
max-line-length = 88

[tool.pylint.DESIGN]
max-attributes = 40

[tool.pylint.TYPECHECK]
ignored-modules = ["orjson"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",  # Decoded JSON is Any by nature.

  # Conflicts with the formatter, which handles both already.
  "COM812",  # missing-trailing-comma
  "ISC001",  # single-line-implicit-string-concatenation

  "CPY001",  # No copyright headers, the LICENSE file covers it.
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["mashumaro.mixins.orjson.DataClassORJSONMixin"]

[tool.ruff.lint.isort]
known-first-party = ["repositoryupdater"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
