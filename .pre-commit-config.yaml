---
# Hooks for prek (https://prek.j178.dev). Run them all with:
#   uv run prek run --all-files
#
# Every hook is local and runs through uv, so its version comes from uv.lock
# and cannot drift from a separate `rev:` pin.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: 🐶 Ruff Linter
        language: system
        types: [python]
        entry: uv run --no-sync ruff check --fix
        require_serial: true
      - id: ruff-format
        name: 🐶 Ruff Formatter
        language: system
        types: [python]
        entry: uv run --no-sync ruff format
        require_serial: true
      - id: check-ast
        name: 🐍 Check Python AST
        language: system
        types: [python]
        entry: uv run --no-sync check-ast
      - id: check-case-conflict
        name: 🔠 Check for case conflicts
        language: system
        entry: uv run --no-sync check-case-conflict
      - id: check-docstring-first
        name: ℹ️  Check docstring is first
        language: system
        types: [python]
        entry: uv run --no-sync check-docstring-first
      - id: check-executables-have-shebangs
        name: 🧐 Check that executables have shebangs
        language: system
        types: [text, executable]
        entry: uv run --no-sync check-executables-have-shebangs
      - id: check-json
        name: ｛ Check JSON files
        language: system
        types: [json]
        entry: uv run --no-sync check-json
      - id: check-merge-conflict
        name: 💥 Check for merge conflicts
        language: system
        types: [text]
        entry: uv run --no-sync check-merge-conflict
      - id: check-symlinks
        name: 🔗 Check for broken symlinks
        language: system
        types: [symlink]
        entry: uv run --no-sync check-symlinks
      - id: check-toml
        name: ✅ Check TOML files
        language: system
        types: [toml]
        entry: uv run --no-sync check-toml
      - id: check-yaml
        name: ✅ Check YAML files
        language: system
        types: [yaml]
        entry: uv run --no-sync check-yaml
      - id: codespell
        name: ✅ Check code for common misspellings
        language: system
        types: [text]
        exclude: ^(uv\.lock|package-lock\.json)$
        entry: uv run --no-sync codespell
      - id: detect-private-key
        name: 🕵️  Detect Private Keys
        language: system
        types: [text]
        entry: uv run --no-sync detect-private-key
      - id: end-of-file-fixer
        name: ⮐  Fix End of Files
        language: system
        types: [text]
        entry: uv run --no-sync end-of-file-fixer
      - id: ty
        name: 🆎 Static type checking using ty
        language: system
        types: [python]
        entry: uv run --no-sync ty check --exit-zero-on-warning
        pass_filenames: false
        require_serial: true
      - id: no-commit-to-branch
        name: 🛑 Don't commit to main branch
        language: system
        entry: uv run --no-sync no-commit-to-branch
        pass_filenames: false
        always_run: true
        args:
          - --branch=main
      - id: prettier
        name: 💄 Ensuring files are prettier
        language: system
        types_or: [yaml, json, markdown]
        entry: npm run prettier
        pass_filenames: false
      - id: trailing-whitespace
        name: ✄  Trim Trailing Whitespace
        language: system
        types: [text]
        entry: uv run --no-sync trailing-whitespace-fixer
      - id: uv-lock
        name: 🔒 Check uv.lock is up to date
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        entry: uv lock --check
        pass_filenames: false
      - id: yamllint
        name: 🎗  Check YAML files with yamllint
        language: system
        types: [yaml]
        entry: uv run --no-sync yamllint
      - id: actionlint
        name: 🎬 Check GitHub Actions workflows with actionlint
        language: system
        types: [yaml]
        files: ^\.github/workflows/
        entry: uv run --no-sync actionlint
      - id: zizmor
        name: 🌈 Check GitHub Actions workflows with zizmor
        language: system
        types: [yaml]
        files: ^\.github/workflows/
        entry: uv run --no-sync zizmor
