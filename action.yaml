---
name: "Home Assistant Community Apps Repository Updater"
description: Tool for updating Home Assistant Apps repositories.
author: frenck

branding:
  color: red
  icon: thumbs-up

inputs:
  token:
    description: GitHub token that is allowed to write/commit to the target repo
    required: true
  repository:
    description: The app repository to update (e.g., frenck/repository)
    required: false
  app:
    description: Slug of the app to update the repository for
    required: false
  addon:
    description: (Deprecated) Use 'app' instead. Slug of the app to update the repository for
    required: false
  force:
    description: Force repository update, even if no changes are detected
    default: "false"
    required: false
  dry_run:
    description: Show what would be committed, without committing
    default: "false"
    required: false
  cache:
    description: Remember what the apps repository holds between runs, to skip reloading it
    default: "true"
    required: false

# A composite action, so it can keep the cache between runs with
# actions/cache, which a Docker action cannot use. The updater runs from the
# image of this very release, so nothing gets built when it runs; the
# release workflow refuses to publish when it does not match the version
# being released.
runs:
  using: composite
  steps:
    - name: 🏗 Restore the cache
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Inside the workspace, which GitHub mounts into the container.
        path: .repository-updater-cache
        # A new key every run saves the newest cache; the prefix restores
        # the one before.
        key: repository-updater-${{ inputs.repository || github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          repository-updater-${{ inputs.repository || github.repository }}-
    - name: 🚀 Run the Repository Updater
      uses: docker://ghcr.io/hassio-addons/repository-updater:3.0.0
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_APP: ${{ inputs.app }}
        INPUT_ADDON: ${{ inputs.addon }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        INPUT_CACHE: ${{ inputs.cache }}
        # Relative to the workspace, which is where the container starts.
        INPUT_CACHE_DIR: .repository-updater-cache
