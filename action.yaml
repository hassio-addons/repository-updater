---
name: "Home Assistant Community Apps Repository Updater"
description: Tool for updating Home Assistant Apps repositories.
author: frenck

branding:
  color: red
  icon: thumbs-up

inputs:
  token:
    description: GitHub token that is allowed to write/commit to the target repo
    required: true
  repository:
    description: The app repository to update (e.g., frenck/repository)
    required: false
  app:
    description: Slug of the app to update the repository for
    required: false
  addon:
    description: (Deprecated) Use 'app' instead. Slug of the app to update the repository for
    required: false
  force:
    description: Force repository update, even if no changes are detected
    default: "false"
    required: false

# The image of this very release, so the action never builds anything when
# it runs. The release workflow refuses to publish when this does not match
# the version being released. GitHub hands the inputs over as INPUT_*
# environment variables, which the CLI reads.
runs:
  using: "docker"
  image: "docker://ghcr.io/hassio-addons/repository-updater:2.0.2"
