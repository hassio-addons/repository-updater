---
name: Release

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published

# Serialize releases per tag and never cancel an in-flight publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  DEFAULT_PYTHON: "3.14"
  IMAGE: ghcr.io/hassio-addons/repository-updater

permissions:
  contents: read

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    permissions:
      # Job permissions replace the top-level block, so the checkout needs read.
      contents: read
      attestations: write # Sign build provenance
      id-token: write # Sign build provenance
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # No cache in the publish path: a poisoned cache must never reach
          # the artifacts we publish.
          enable-cache: false
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: 🏗 Set package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG}"
          version="${version,,}"
          version="${version#v}"
          uv version --no-sync "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      # The action runs the image of its own release; catch a release that
      # forgot to point action.yaml at it before anything gets published.
      - name: 🔍 Check the action uses this release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="  image: \"docker://${IMAGE}:${VERSION}\""
          if ! grep --quiet --fixed-strings --line-regexp "${expected}" action.yaml; then
            echo "::error file=action.yaml::action.yaml must use docker://${IMAGE}:${VERSION}"
            exit 1
          fi
      - name: 🏗 Build package
        run: uv build
      - name: 🧭 Locate the built wheel
        run: echo "WHEEL_PATH=$(ls dist/repository_updater-*-py3-none-any.whl)" >> "${GITHUB_ENV}"
      - name: 📝 Generate a CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ env.WHEEL_PATH }}
          format: cyclonedx-json
          output-file: repository-updater.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: 📝 Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: 📝 Attest the SBOM against the wheel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.WHEEL_PATH }}
          sbom-path: repository-updater.cdx.json
      - name: ⬆️ Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: release
      url: https://pypi.org/p/repository-updater
    permissions:
      id-token: write # Trusted publishing to PyPI
    steps:
      - name: ⬇️ Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          verbose: true
          print-hash: true

  image:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    # Only once the package is on PyPI, so an image never exists for a
    # version that failed to publish.
    needs:
      - build
      - pypi
    permissions:
      contents: read
      packages: write # Push the image to GHCR
      attestations: write # Sign build provenance
      id-token: write # Sign build provenance and the image itself
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⬇️ Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: 🏗 Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: 🏗 Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: 🏗 Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 1.2.3, 1.2 and 1 for a release, plus latest; a prerelease only gets
      # its own version.
      - name: 🏷 Determine image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: 🚀 Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # A path context, not the Git one: the wheel lives in dist/.
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ needs.build.outputs.version }}
      - name: 📝 Attest image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: 🏗 Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless: the signature is bound to this workflow run through its
      # OIDC identity, verifiable with `cosign verify`.
      - name: 🔏 Sign image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
