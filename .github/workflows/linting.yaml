---
name: Linting

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  DEFAULT_PYTHON: "3.14"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codespell:
    name: codespell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: 🏗 Install dependencies
        run: uv sync --locked --group dev
      - name: 🚀 Check code for common misspellings
        run: uv run --no-sync prek run codespell --all-files

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: 🏗 Install dependencies
        run: uv sync --locked --group dev
      - name: 🚀 Run ruff check
        run: uv run --no-sync ruff check --output-format=github .
      - name: 🚀 Run ruff format
        run: uv run --no-sync ruff format --check --diff .

  prek-hooks:
    name: prek-hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: 🏗 Install dependencies
        run: uv sync --locked --group dev
      - name: 🚀 Check Python AST
        run: uv run --no-sync prek run check-ast --all-files
      - name: 🚀 Check for case conflicts
        run: uv run --no-sync prek run check-case-conflict --all-files
      - name: 🚀 Check docstring is first
        run: uv run --no-sync prek run check-docstring-first --all-files
      - name: 🚀 Check that executables have shebangs
        run: uv run --no-sync prek run check-executables-have-shebangs --all-files
      - name: 🚀 Check JSON files
        run: uv run --no-sync prek run check-json --all-files
      - name: 🚀 Check for merge conflicts
        run: uv run --no-sync prek run check-merge-conflict --all-files
      - name: 🚀 Check for broken symlinks
        run: uv run --no-sync prek run check-symlinks --all-files
      - name: 🚀 Check TOML files
        run: uv run --no-sync prek run check-toml --all-files
      - name: 🚀 Check YAML files
        run: uv run --no-sync prek run check-yaml --all-files
      - name: 🚀 Detect Private Keys
        run: uv run --no-sync prek run detect-private-key --all-files
      - name: 🚀 Check End of Files
        run: uv run --no-sync prek run end-of-file-fixer --all-files
      - name: 🚀 Trim Trailing Whitespace
        run: uv run --no-sync prek run trailing-whitespace --all-files

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: 🏗 Install dependencies
        run: uv sync --locked --group dev
      - name: 🚀 Run actionlint
        run: uv run --no-sync actionlint

  pylint:
    name: pylint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: 🏗 Install dependencies
        run: uv sync --locked --group dev
      - name: 🚀 Run pylint
        run: uv run --no-sync prek run pylint --all-files

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: 🏗 Install dependencies
        run: uv sync --locked --group dev
      - name: 🚀 Run zizmor
        run: uv run --no-sync zizmor .github/workflows/

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: 🏗 Install dependencies
        run: uv sync --locked --group dev
      - name: 🚀 Run yamllint
        run: uv run --no-sync yamllint .

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: 🏗 Install dependencies
        run: uv sync --locked --group dev
      - name: 🏗 Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: 🏗 Install NPM dependencies
        run: npm ci
      - name: 🚀 Run prettier
        run: uv run --no-sync prek run prettier --all-files
